<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>IT Assets · Ink</title><link rel="stylesheet" href="/itam.css"></head>
<body class="x"><main>
<div class="page-head"><div><p class="eyebrow">Workspace</p><h1>Ink</h1><p>Ask for toner for your printer. The Ink Officer of your region sends your request to the approving manager; once approved, the Ink Officer delivers it from the shelf or orders it from the supplier. No paper to sign: the request and its approval are kept in IT Assets.</p></div>
<div class="actions"><button class="primary" type="button" id="new-request">Ask for ink</button></div></div>
<p id="message" role="status"></p>
<div id="view"></div>
<dialog id="dialog"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body" class="grid two"></div><label class="wide" id="reason-label">Reason (kept in the audit log)<input id="dialog-reason" maxlength="1000"></label><div class="actions"><button class="primary" id="dialog-save" type="submit">Save</button><button type="button" id="dialog-cancel">Cancel</button></div></form></dialog>
</main><script type="module" src="/ink.js"></script></body></html>
