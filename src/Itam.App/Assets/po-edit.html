<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>IT Assets · Purchase order</title><link rel="stylesheet" href="/itam.css"></head>
<body class="x"><main>
<div class="page-head"><div><p class="eyebrow">Purchase orders › Record a PO</p><h1 id="title">Record a PO</h1><p id="subtitle">Type the PO as written on the document from Procurement, with one line per product, and attach the PDF.</p></div><div class="actions"><a href="/pos.html"><button type="button">All POs</button></a></div></div>
<p id="message" role="status"></p>
<form id="po-form" class="card"><div id="head" class="grid two"></div><h2>PO lines</h2><div class="table-wrap"><table><thead><tr><th>Line</th><th>Type</th><th>Manufacturer</th><th>Model</th><th>Specification</th><th>Quantity</th><th>Unit cost (SAR, before VAT)</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><div class="actions"><button type="button" id="add-line">Add a line</button><span class="hint" id="totals"></span></div><label class="wide">Reason (kept in the audit log)<input id="po-reason" maxlength="1000"></label><div class="actions"><button class="primary" type="submit" id="po-save">Save the PO</button></div></form>
<dialog id="dialog"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body" class="grid two"></div><label class="wide" id="reason-label">Reason (kept in the audit log)<input id="dialog-reason" maxlength="1000"></label><div class="actions"><button class="primary" id="dialog-save" type="submit">Save</button><button type="button" id="dialog-cancel">Cancel</button></div></form></dialog>
</main><script type="module" src="/po-edit.js"></script></body></html>
