<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Assets · My Backup</title><link rel="stylesheet" href="/itam.css"></head>
<body><main>
<div class="page-head"><div><p class="eyebrow">Before you go on leave</p><h1>My Backup</h1><p>Choose who acts for you while you are away, so approvals and tasks never wait.</p></div></div>
<p id="message" role="status"></p>
<div id="view"></div>
<dialog id="dialog"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body" class="grid two"></div><label class="wide" id="reason-label">Reason (kept in the audit log)<input id="dialog-reason" maxlength="1000"></label><div class="actions"><button class="primary" id="dialog-save" type="submit">Save</button><button type="button" id="dialog-cancel">Cancel</button></div></form></dialog>
</main><script type="module" src="/backups.js"></script></body></html>
