<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>IT Assets · Maintenance</title><link rel="stylesheet" href="/itam.css"></head>

<div class="page-head"><div><p class="eyebrow">Workspace</p><h1>Maintenance</h1><p>Maintenance orders for assets repaired by an outside supplier: quotation, IT Manager approval, sent to the supplier (In Repair), back with the outcome and invoice. Repairs IT does itself are recorded on the asset's history.</p></div>

<p id="message" role="status"></p>
<div id="view"></div>
