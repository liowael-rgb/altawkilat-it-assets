<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>IT Assets · Asset</title><link rel="stylesheet" href="/itam.css"></head>
<body class="x"><main>
<div class="page-head"><div><p class="eyebrow" id="eyebrow">Assets</p><h1 id="title">Asset</h1><p id="subtitle"></p></div><div class="actions" id="head-actions"><a href="/"><button type="button">All assets</button></a></div></div>
<p id="message" role="status"></p>
<div id="view"></div>
<form id="asset-form" hidden novalidate><div id="fields"></div><div class="x-reason"><label>Reason for the change (kept in the audit log)<input id="edit-reason" maxlength="1000" placeholder="Why are you changing it?"></label></div>
<div class="x-cmd inpage"><button type="button" id="edit-cancel">Cancel</button><button class="primary" type="submit">Save changes</button></div></form>
<dialog id="dialog"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body" class="grid two"></div><label class="wide" id="reason-label">Reason (kept in the audit log)<input id="dialog-reason" maxlength="1000"></label><div class="actions"><button class="primary" id="dialog-save" type="submit">Save</button><button type="button" id="dialog-cancel">Cancel</button></div></form></dialog>
</main><script type="module" src="/asset.js"></script></body></html>
