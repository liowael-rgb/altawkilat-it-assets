<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Assets · Assets</title><link rel="stylesheet" href="/itam.css"></head>
<body><main>
<div class="page-head"><div><p class="eyebrow">IT asset register</p><h1>Assets</h1><p>Every IT asset with its Asset No., where it is kept and its history.</p></div><div class="actions"><a id="new-link" href="/asset-new.html" hidden><button class="primary" type="button">Register an asset</button></a></div></div>
<p id="message" role="status"></p>
<form id="filters" class="filters"><label>Search<input id="q" type="search" maxlength="100" placeholder="Asset No., serial, service tag, MAC, model, computer name or PO"></label><label>Type<select id="type"><option value="">All types</option></select></label><label>Status<select id="status"><option value="">All statuses</option></select></label><label>Region<select id="region"><option value="">All regions</option></select></label><label>Kept at<select id="location"><option value="">Everywhere</option></select></label><div class="actions"><button class="primary" type="submit">Search</button><button type="button" id="clear">Clear</button></div></form><div class="card"><div class="table-wrap"><table><thead><tr><th>Asset No.</th><th>Type</th><th>Manufacturer and model</th><th>Serial / service tag</th><th>Computer name</th><th>Status</th><th>Kept at</th><th>Region</th><th>PO</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button><span class="hint" id="page"></span></div></div>
<dialog id="dialog"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body" class="grid two"></div><label class="wide" id="reason-label">Reason (kept in the audit log)<input id="dialog-reason" maxlength="1000"></label><div class="actions"><button class="primary" id="dialog-save" type="submit">Save</button><button type="button" id="dialog-cancel">Cancel</button></div></form></dialog>
</main><script type="module" src="/assets.js"></script></body></html>
