<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>IT Assets · Tasks</title><link rel="stylesheet" href="/itam.css"></head>
<body class="x"><main>
<div class="page-head"><div><p class="eyebrow">Workspace</p><h1>Tasks</h1><p id="intro">Clean-up after an asset comes back to IT.</p></div></div>
<p id="message" role="status"></p>
<div id="stats" class="x-stats"></div>
<section class="card"><h2 id="list-title">Tasks</h2><p class="hint" id="list-hint"></p>
<div class="x-filterbar"><div class="x-seg" id="filter"></div></div>

</main><script type="module" src="/tasks.js"></script></body></html>
