<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>IT Assets · Purchase orders</title><link rel="stylesheet" href="/itam.css"></head>
<body class="x"><main>
<div class="page-head"><div><p class="eyebrow">Workspace</p><h1>Purchase orders</h1><p>POs sent by Procurement by email: record the PO with its document, receive the devices against it, and print the PO pack for Accounting.</p></div><div class="actions"><a id="new-link" href="/po-edit.html" hidden><button class="primary" type="button">Record a PO</button></a></div></div>
